name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run on push to master
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: arshahvaran
          template: classic
          
          # BASE CONFIGURATION
          # We keep 'header' (your name/bio) and 'community' (followers/following).
          # We REMOVED 'activity' and 'repositories' to delete the redundant stats (75 contributions, 0 stars, etc).
          base: header, community
          config_timezone: America/Toronto

          # 1. LANGUAGES (Fixed)
          # We added specific settings to force it to show your code breakdown
          plugin_languages: yes
          plugin_languages_details: lines, percentage
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

          # 2. TROPHIES (Achievements)
          # This is the "never goes down" version of trophies
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C
