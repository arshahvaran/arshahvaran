name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: arshahvaran
          template: classic
          
          # 1. CLEAN UP THE LAYOUT
          # "base: header" removes the 'Contributed to' bar, stars, forks, and spider plot.
          base: header
          config_timezone: America/Toronto

          # 2. FIX "0 LANGUAGES"
          # "indepth: yes" forces the robot to clone your repos and count the real lines of code.
          # This fixes the issue where it misses files in folders.
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: lines, percentage
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

          # 3. FIX "ACHIEVEMENTS ERROR"
          # We switch to "compact" mode. The "detailed" mode often crashes (Error 402) 
          # when the icons fail to load from the server. Compact is safer.
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
